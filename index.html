<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Netflix Clone</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <h1 class="logo">NETFLIX</h1>

        <nav>
            <a href="#">Início</a>
            <a href="#filmes">Filmes</a>
            <a href="#acao">Ação</a>
            <a href="#ficcao">Ficção científica</a>
        </nav>

        <div class="search-box" id="search-box">

            <input
                type="text"
                id="search-input"
                placeholder="Buscar filmes..."
                autocomplete="off"
            >

            <button
                id="search-button"
                aria-label="Pesquisar"
            ></button>

        </div>

    </header>


    <!-- CONTEÚDO -->
    <main>

        <!-- HERO -->
        <section
            class="hero"
            id="hero"
        >

            <div class="hero-overlay"></div>

            <div class="hero-content">

                <p
                    class="category"
                    id="hero-category"
                >
                    FILME • FICÇÃO CIENTÍFICA
                </p>

                <h2 id="hero-title">
                    Interestelar
                </h2>

                <p
                    class="description"
                    id="hero-description"
                >
                    Uma equipe de exploradores viaja através de um
                    buraco de minhoca em busca de um novo lar para a humanidade.
                </p>

                <div class="buttons">

                    <button
                        class="btn-play"
                        id="hero-play"
                    >
                        ▶ Assistir
                    </button>

                    <button
                        class="btn-info"
                        id="hero-info"
                    >
                        ⓘ Mais informações
                    </button>

                </div>

            </div>

        </section>


        <!-- CATÁLOGO -->
        <main
            class="catalog"
            id="filmes"
        >

            <!-- RESULTADOS DA PESQUISA -->
            <section
                class="search-results-section"
                id="search-results-section"
                hidden
            >

                <h2>Resultados da pesquisa</h2>

                <div
                    class="movie-list"
                    id="search-results"
                ></div>

            </section>


            <!-- POPULARES -->
            <section class="movie-section">

                <h2>Filmes populares</h2>

                <div
                    class="movie-list"
                    id="popular-movies"
                ></div>

            </section>


            <!-- AÇÃO -->
            <section
                class="movie-section"
                id="acao"
            >

                <h2>Ação</h2>

                <div
                    class="movie-list"
                    id="action-movies"
                ></div>

            </section>


            <!-- FICÇÃO -->
            <section
                class="movie-section"
                id="ficcao"
            >

                <h2>Ficção científica</h2>

                <div
                    class="movie-list"
                    id="fiction-movies"
                ></div>

            </section>


            <!-- SUSPENSE -->
            <section class="movie-section">

                <h2>Suspense</h2>

                <div
                    class="movie-list"
                    id="thriller-movies"
                ></div>

            </section>

        </main>

    </main>


    <!-- JAVASCRIPT -->
    <script src="js/script.js"></script>

</body>

</html>
